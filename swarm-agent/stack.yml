version: '3.8'
# Deploy:  set -a; . ./.env.agent; set +a; docker stack deploy -c stack.yml swarmui-agent
# Required vars: AGENT_TOKEN
services:
  swarmui-agent:
    image: alicankuklaci/swarmui-agent:latest
    environment:
      - AGENT_TOKEN=${AGENT_TOKEN}
      - AGENT_READONLY=false
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host          # Her node kendi portunu açar
    deploy:
      mode: global          # Her node'da 1 adet çalışır
      restart_policy:
        condition: on-failure
